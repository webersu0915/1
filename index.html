<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設備掃描借還系統</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 16px; background: #f8f9fa; margin: 0; }
    select { padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 300px; box-sizing: border-box; margin-bottom: 10px; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; white-space: pre-wrap; line-height: 1.5; min-height: 60px; }
    .mode-switch { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
    .mode-btn { flex: 1; max-width: 150px; padding: 12px 0; font-size: 18px; font-weight: bold; border: 2px solid #ccc; border-radius: 8px; background: #fff; color: #555; cursor: pointer; }
    .mode-btn.active.borrow { background: #0d6efd; border-color: #0d6efd; color: #fff; }
    .mode-btn.active.return { background: #fd7e14; border-color: #fd7e14; color: #fff; }
    #history { max-width: 450px; margin: 15px auto 0; text-align: left; font-size: 14px; color: #555; }
    #history div { padding: 4px 0; border-bottom: 1px solid #e5e5e5; }
    #go-borrowed { display: block; width: 100%; max-width: 450px; margin: 20px auto 0; padding: 14px 0; font-size: 17px; font-weight: bold; border: 2px solid #198754; border-radius: 8px; background: #fff; color: #198754; cursor: pointer; }
    #go-borrowed:active { background: #198754; color: #fff; }

    /* 登入畫面 */
    #login-view { max-width: 340px; margin: 60px auto 0; background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.1); padding: 28px 20px; }
    #login-view h2 { margin-top: 0; }
    #student-id { padding: 12px; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; text-align: center; }
    #login-btn { margin-top: 14px; width: 100%; padding: 14px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; background: #0d6efd; color: #fff; cursor: pointer; }
    #login-msg { color: red; min-height: 22px; margin-top: 10px; font-size: 15px; }

    /* 使用者列 */
    #user-bar { display: flex; justify-content: space-between; align-items: center; max-width: 450px; margin: 0 auto 12px; padding: 8px 12px; background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); font-size: 16px; }
    #logout-btn { padding: 8px 14px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>

  <!-- ===== 登入畫面 ===== -->
  <div id="login-view">
    <h2>🔐 登入</h2>
    <input id="student-id" placeholder="請輸入學號" autocomplete="off">
    <button id="login-btn">登入</button>
    <div id="login-msg"></div>
  </div>

  <!-- ===== 主系統 ===== -->
  <div id="app-view" style="display:none">
    <h2>📷 設備掃描借還系統</h2>

    <div id="user-bar">
      <span>👤 學號：<b id="user-label"></b></span>
      <button id="logout-btn">登出</button>
    </div>

    <div class="mode-switch">
      <button id="btn-borrow" class="mode-btn borrow active">📤 借出</button>
      <button id="btn-return" class="mode-btn return">📥 歸還</button>
    </div>

    <select id="camera-select"></select>

    <div id="reader"></div>
    <div id="result">相機啟動中，請稍候...</div>
    <div id="history"></div>

    <button id="go-borrowed">📋 查看已借出清單</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYZSAEyIBOef03RRw5Eponrs1nlqvWDfNffvsArsBioxCYsneii2Glhp1z04TtwQNS/exec";

    // 自動判斷：在 Apps Script 裡用 google.script.run，在 GitHub 用 fetch
    const IN_APPSCRIPT = !!(window.google && google.script && google.script.run);

    function apiScan(id, mode, borrower) {
      return new Promise((resolve, reject) => {
        if (IN_APPSCRIPT) {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
            .processScan(id, mode, borrower);
        } else {
          const url = API_URL + "?id=" + encodeURIComponent(id)
            + "&mode=" + encodeURIComponent(mode)
            + "&borrower=" + encodeURIComponent(borrower);
          fetch(url, { cache: "no-store" }).then(r => r.json()).then(resolve).catch(reject);
        }
      });
    }

    function goBorrowed() {
      if (IN_APPSCRIPT) {
        google.script.run
          .withSuccessHandler(url => { window.open(url + "?page=borrowed", "_top"); })
          .withFailureHandler(err => { alert("無法開啟清單頁面：" + (err.message || err)); })
          .getAppUrl();
      } else {
        location.href = "borrowed.html";
      }
    }

    let currentMode = "borrow";
    let studentId = "";
    let isProcessing = false;
    let camerasLoaded = false;
    let lastCode = "", lastTime = 0;

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    const loginView = document.getElementById("login-view");
    const appView = document.getElementById("app-view");
    const studentInput = document.getElementById("student-id");
    const loginMsg = document.getElementById("login-msg");
    const userLabel = document.getElementById("user-label");
    const cameraSelect = document.getElementById("camera-select");
    const resultDiv = document.getElementById("result");
    const historyDiv = document.getElementById("history");
    const btnBorrow = document.getElementById("btn-borrow");
    const btnReturn = document.getElementById("btn-return");

    // ===== 相機停止（出錯也不會卡住）=====
    let stopping = Promise.resolve();
    function stopCamera() {
      stopping = new Promise(resolve => {
        try {
          const p = html5QrCode.stop();
          if (p && p.then) p.then(resolve, resolve); else resolve();
        } catch (e) { resolve(); }
      });
      return stopping;
    }

    // ===== 登入 / 登出 =====
    function login() {
      const v = studentInput.value.trim();
      if (!v) { loginMsg.textContent = "請輸入學號"; return; }
      try { sessionStorage.setItem("sid", v); } catch (e) {}   // 同一個分頁內來回不用重登
      try { localStorage.setItem("lastSid", v); } catch (e) {} // 下次登入畫面自動帶入
      showApp(v);
    }

    function logout() {
      try { sessionStorage.removeItem("sid"); } catch (e) {}
      // 先切回登入畫面，再在背景停止相機
      studentId = "";
      isProcessing = false;
      historyDiv.innerHTML = "";
      appView.style.display = "none";
      loginView.style.display = "block";
      loginMsg.textContent = "";
      try { studentInput.value = localStorage.getItem("lastSid") || ""; } catch (e) {}
      stopCamera();
    }

    function showApp(id) {
      studentId = id;
      userLabel.textContent = id;
      loginView.style.display = "none";
      appView.style.display = "block";
      setMode(currentMode);
      startScanner();
    }

    document.getElementById("login-btn").addEventListener("click", login);
    studentInput.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
    document.getElementById("logout-btn").addEventListener("click", logout);

    // ===== 模式 =====
    function setMode(mode) {
      currentMode = mode;
      btnBorrow.classList.toggle("active", mode === "borrow");
      btnReturn.classList.toggle("active", mode === "return");
      resultDiv.style.color = "#333";
      resultDiv.innerText = (mode === "borrow" ? "【借出模式】" : "【歸還模式】") + "\n請對準 QR Code 進行掃描...";
    }
    btnBorrow.addEventListener("click", () => setMode("borrow"));
    btnReturn.addEventListener("click", () => setMode("return"));
    document.getElementById("go-borrowed").addEventListener("click", goBorrowed);

    function feedback(ok) {
      try { navigator.vibrate && navigator.vibrate(ok ? 100 : [100, 60, 100]); } catch (e) {}
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = ok ? 880 : 300;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function addHistory(ok, modeLabel, text) {
      const d = document.createElement("div");
      const t = new Date().toLocaleTimeString("zh-TW", { hour12: false });
      d.textContent = `${ok ? "✅" : "❌"} ${t} [${modeLabel}] ${text.split("\n").join(" ")}`;
      historyDiv.prepend(d);
      while (historyDiv.children.length > 5) historyDiv.removeChild(historyDiv.lastChild);
    }

    // ===== 掃描 =====
    function onScanSuccess(decodedText) {
      if (!studentId) return;
      if (isProcessing) return;
      // 3 秒內同一個碼不重複處理
      if (decodedText === lastCode && Date.now() - lastTime < 3000) return;
      isProcessing = true;
      lastCode = decodedText;
      lastTime = Date.now();

      if (decodedText.includes("text=")) {
        decodedText = decodedText.split("text=")[1].split("&")[0];
      }

      const modeLabel = currentMode === "borrow" ? "借出" : "歸還";
      resultDiv.style.color = "#0056b3";
      resultDiv.innerText = `[${modeLabel}] 讀取到編號：${decodedText}\n處理中...`;

      apiScan(decodedText, currentMode, studentId)
        .then(data => {
          resultDiv.style.color = data.ok ? "green" : "red";
          resultDiv.innerText = data.message;
          feedback(data.ok);
          addHistory(data.ok, modeLabel, data.message);
          release();
        })
        .catch(err => {
          resultDiv.style.color = "red";
          resultDiv.innerText = "系統連線錯誤：" + (err.message || err);
          feedback(false);
          release();
        });
    }

    function release() {
      setTimeout(() => { isProcessing = false; if (studentId) setMode(currentMode); }, 2500);
    }

    function startCamera(cameraId) {
      stopping.then(() => {
        try {
          return html5QrCode.start(cameraId, config, onScanSuccess);
        } catch (e) {
          return Promise.reject(e);
        }
      }).then(() => {
        if (!studentId) { stopCamera(); return; } // 啟動途中已登出
        setMode(currentMode);
      }).catch(err => {
        resultDiv.style.color = "red";
        resultDiv.innerText = "相機啟動失敗：" + err + "\n請允許相機權限，並用手機瀏覽器直接開啟網址。";
      });
    }

    // ===== 啟動相機（登入後才開始）=====
    function startScanner() {
      if (camerasLoaded) { startCamera(cameraSelect.value); return; }

      Html5Qrcode.getCameras().then(devices => {
        if (!devices || !devices.length) {
          resultDiv.innerText = "找不到可用的相機。";
          return;
        }
        devices.forEach((d, i) => {
          const o = document.createElement("option");
          o.value = d.id;
          o.text = d.label || `相機 ${i + 1}`;
          cameraSelect.appendChild(o);
        });
        const back = devices.findIndex(d => /back|rear|environment|後/i.test(d.label));
        if (back >= 0) cameraSelect.selectedIndex = back;
        camerasLoaded = true;
        startCamera(cameraSelect.value);
      }).catch(err => {
        resultDiv.style.color = "red";
        resultDiv.innerText = "無法取得相機清單，請確認權限。";
      });
    }

    cameraSelect.addEventListener("change", () => {
      stopCamera();
      startCamera(cameraSelect.value);
    });

    // ===== 開頁：已登入（同分頁）直接進系統，否則顯示登入畫面 =====
    (function init() {
      let sid = "";
      try { sid = sessionStorage.getItem("sid") || ""; } catch (e) {}
      if (sid) {
        showApp(sid);
      } else {
        try { studentInput.value = localStorage.getItem("lastSid") || ""; } catch (e) {}
        loginView.style.display = "block";
        studentInput.focus();
      }
    })();
  </script>
</body>
</html>
