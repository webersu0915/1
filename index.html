<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 16px; background: #f8f9fa; margin: 0; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; white-space: pre-wrap; line-height: 1.5; min-height: 60px; }
    input, select { padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 300px; box-sizing: border-box; margin-bottom: 10px; }
    .mode-switch { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
    .mode-btn { flex: 1; max-width: 150px; padding: 12px 0; font-size: 18px; font-weight: bold; border: 2px solid #ccc; border-radius: 8px; background: #fff; color: #555; cursor: pointer; }
    .mode-btn.active.borrow { background: #0d6efd; border-color: #0d6efd; color: #fff; }
    .mode-btn.active.return { background: #fd7e14; border-color: #fd7e14; color: #fff; }
    #history { max-width: 450px; margin: 15px auto 0; text-align: left; font-size: 14px; color: #555; }
    #history div { padding: 4px 0; border-bottom: 1px solid #e5e5e5; }

    /* 已借出清單 */
    #borrowed { max-width: 450px; margin: 20px auto 0; text-align: left; background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 12px 14px; }
    #borrowed h3 { margin: 0 0 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    #borrowed button { font-size: 13px; padding: 4px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    .b-item { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 15px; }
    .b-item:last-child { border-bottom: none; }
    .b-sub { color: #777; font-size: 13px; margin-top: 2px; }
  </style>
</head>
<body>
  <h2>📷 設備掃描借還系統</h2>

  <div class="mode-switch">
    <button id="btn-borrow" class="mode-btn borrow active">📤 借出</button>
    <button id="btn-return" class="mode-btn return">📥 歸還</button>
  </div>

  <input id="borrower" placeholder="借用人（選填）">
  <br>
  <select id="camera-select"></select>

  <div id="reader"></div>
  <div id="result">相機啟動中，請稍候...</div>
  <div id="history"></div>

  <div id="borrowed">
    <h3><span>📋 已借出清單（<span id="b-count">0</span>）</span><button id="b-refresh">重新整理</button></h3>
    <div id="b-list">載入中...</div>
  </div>

  <script>
    let currentMode = "borrow";
    let isProcessing = false;
    let lastCode = "", lastTime = 0;

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    const cameraSelect = document.getElementById("camera-select");
    const resultDiv = document.getElementById("result");
    const historyDiv = document.getElementById("history");
    const borrowerInput = document.getElementById("borrower");
    const btnBorrow = document.getElementById("btn-borrow");
    const btnReturn = document.getElementById("btn-return");

    // 記住借用人（儲存失敗就略過）
    try { borrowerInput.value = localStorage.getItem("borrower") || ""; } catch (e) {}
    borrowerInput.addEventListener("input", () => {
      try { localStorage.setItem("borrower", borrowerInput.value); } catch (e) {}
    });

    function setMode(mode) {
      currentMode = mode;
      btnBorrow.classList.toggle("active", mode === "borrow");
      btnReturn.classList.toggle("active", mode === "return");
      resultDiv.style.color = "#333";
      resultDiv.innerText = (mode === "borrow" ? "【借出模式】" : "【歸還模式】") + "\n請對準 QR Code 進行掃描...";
    }
    btnBorrow.addEventListener("click", () => setMode("borrow"));
    btnReturn.addEventListener("click", () => setMode("return"));

    function feedback(ok) {
      try { navigator.vibrate && navigator.vibrate(ok ? 100 : [100, 60, 100]); } catch (e) {}
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = ok ? 880 : 300;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function addHistory(ok, modeLabel, text) {
      const d = document.createElement("div");
      const t = new Date().toLocaleTimeString("zh-TW", { hour12: false });
      d.textContent = `${ok ? "✅" : "❌"} ${t} [${modeLabel}] ${text.split("\n").join(" ")}`;
      historyDiv.prepend(d);
      while (historyDiv.children.length > 5) historyDiv.removeChild(historyDiv.lastChild);
    }

    // ===== 已借出清單 =====
    function loadBorrowed() {
      google.script.run
        .withSuccessHandler(list => {
          document.getElementById("b-count").textContent = list.length;
          const box = document.getElementById("b-list");
          box.innerHTML = "";
          if (!list.length) { box.textContent = "目前沒有借出中的設備 🎉"; return; }
          list.forEach(it => {
            const d = document.createElement("div");
            d.className = "b-item";
            const t = document.createElement("div");
            t.textContent = `${it.id}｜${it.title}`;
            d.appendChild(t);
            const sub = [it.who ? "借用人：" + it.who : "", it.time ? "借出：" + it.time : ""]
              .filter(Boolean).join("　");
            if (sub) {
              const s = document.createElement("div");
              s.className = "b-sub";
              s.textContent = sub;
              d.appendChild(s);
            }
            box.appendChild(d);
          });
        })
        .withFailureHandler(err => {
          document.getElementById("b-list").textContent = "清單載入失敗：" + (err.message || err);
        })
        .getBorrowedList();
    }
    document.getElementById("b-refresh").addEventListener("click", loadBorrowed);

    // ===== 掃描 =====
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      // 3 秒內同一個碼不重複處理
      if (decodedText === lastCode && Date.now() - lastTime < 3000) return;
      isProcessing = true;
      lastCode = decodedText;
      lastTime = Date.now();

      if (decodedText.includes("text=")) {
        decodedText = decodedText.split("text=")[1].split("&")[0];
      }

      const modeLabel = currentMode === "borrow" ? "借出" : "歸還";
      resultDiv.style.color = "#0056b3";
      resultDiv.innerText = `[${modeLabel}] 讀取到編號：${decodedText}\n處理中...`;

      google.script.run
        .withSuccessHandler(data => {
          resultDiv.style.color = data.ok ? "green" : "red";
          resultDiv.innerText = data.message;
          feedback(data.ok);
          addHistory(data.ok, modeLabel, data.message);
          loadBorrowed();
          release();
        })
        .withFailureHandler(err => {
          resultDiv.style.color = "red";
          resultDiv.innerText = "系統連線錯誤：" + (err.message || err);
          feedback(false);
          release();
        })
        .processScan(decodedText, currentMode, borrowerInput.value);
    }

    function release() {
      setTimeout(() => { isProcessing = false; setMode(currentMode); }, 2500);
    }

    function startCamera(cameraId) {
      html5QrCode.start(cameraId, config, onScanSuccess)
        .then(() => setMode(currentMode))
        .catch(err => {
          resultDiv.style.color = "red";
          resultDiv.innerText = "相機啟動失敗：" + err + "\n請允許相機權限，並用手機瀏覽器直接開啟網址。";
        });
    }

    // ===== 先啟動相機，再載入清單 =====
    Html5Qrcode.getCameras().then(devices => {
      if (!devices || !devices.length) {
        resultDiv.innerText = "找不到可用的相機。";
        return;
      }
      devices.forEach((d, i) => {
        const o = document.createElement("option");
        o.value = d.id;
        o.text = d.label || `相機 ${i + 1}`;
        cameraSelect.appendChild(o);
      });
      const back = devices.findIndex(d => /back|rear|environment|後/i.test(d.label));
      if (back >= 0) cameraSelect.selectedIndex = back;
      startCamera(cameraSelect.value);

      cameraSelect.addEventListener("change", () => {
        html5QrCode.stop().then(() => startCamera(cameraSelect.value));
      });
    }).catch(err => {
      resultDiv.style.color = "red";
      resultDiv.innerText = "無法取得相機清單，請確認權限。";
    });

    loadBorrowed();
  </script>
</body>
</html>
